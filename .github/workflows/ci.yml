name: LMS quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests, vet, and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - run: go test -coverprofile=coverage.out ./...
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend lint, build, and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

  minio-r2-integration:
    needs: backend
    runs-on: ubuntu-latest
    services:
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin-ci-password
        ports:
          - 9000
    defaults:
      run:
        working-directory: backend
    env:
      RUN_R2_INTEGRATION: '1'
      APP_ENV: development
      BACKUP_R2_ENDPOINT: http://127.0.0.1:9000
      BACKUP_R2_ACCOUNT_ID: minio
      BACKUP_R2_BUCKET: pkbm-lms-ci
      BACKUP_R2_ACCESS_KEY_ID: minioadmin
      BACKUP_R2_SECRET_ACCESS_KEY: minioadmin-ci-password
      BACKUP_R2_PREFIX: pkbm-lms-ci
      BACKUP_R2_TIMEOUT: 20s
      BACKUP_ENCRYPTION_KEY: ci-r2-encryption-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Wait for MinIO and run R2 integration
        run: |
          export BACKUP_R2_ENDPOINT="http://127.0.0.1:${{ job.services.minio.ports[9000] }}"
          for attempt in {1..30}; do
            if curl --fail --silent "${BACKUP_R2_ENDPOINT}/minio/health/live"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          go test -run TestR2S3CompatibleIntegration -v ./cmd/server

  docker-smoke:
    needs: [backend, frontend, minio-r2-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start production-like stack
        run: |
          docker compose --env-file .github/ci.env config --quiet
          docker compose --env-file .github/ci.env up --build -d
          for i in {1..30}; do
            APP_PORT=$(docker compose --env-file .github/ci.env port app 8080 | sed 's/.*://')
            if curl --fail --silent "http://127.0.0.1:${APP_PORT}/api/health"; then break; fi
            sleep 2
          done
          test -n "${APP_PORT:-}"
          curl --fail --silent "http://127.0.0.1:${APP_PORT}/health"
          echo "E2E_BASE_URL=http://127.0.0.1:${APP_PORT}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run browser smoke test
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Save diagnostics
        if: always()
        run: docker compose --env-file .github/ci.env logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-and-playwright-report
          path: |
            docker-compose.log
            frontend/playwright-report
            frontend/test-results
