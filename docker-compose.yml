services:
  app:
    build: 
      context: .
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVE_STATIC: ${SERVE_STATIC:-false}
      PORT: "8080"
      BACKUP_AUTO_RESTART: ${BACKUP_AUTO_RESTART:-true}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_MAX_ARCHIVE_MB: ${BACKUP_MAX_ARCHIVE_MB:-4096}
      BACKUP_CRON: ${BACKUP_CRON:-}
      BACKUP_FORMAT: ${BACKUP_FORMAT:-full}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_API_KEY: ${BACKUP_API_KEY:-}
      N8N_PRESENSI_API_KEY: ${N8N_PRESENSI_API_KEY:-}
      BACKUP_OFFSITE_URL: ${BACKUP_OFFSITE_URL:-}
      BACKUP_OFFSITE_METHOD: ${BACKUP_OFFSITE_METHOD:-PUT}
      BACKUP_OFFSITE_TOKEN: ${BACKUP_OFFSITE_TOKEN:-}
      BACKUP_OFFSITE_TIMEOUT: ${BACKUP_OFFSITE_TIMEOUT:-5m}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DRILL_DATABASE_URL: ${BACKUP_DRILL_DATABASE_URL:-}
      BACKUP_R2_ACCOUNT_ID: ${BACKUP_R2_ACCOUNT_ID:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_PREFIX: ${BACKUP_R2_PREFIX:-pkbm-lms}
      BACKUP_R2_RETENTION_DAYS: ${BACKUP_R2_RETENTION_DAYS:-36}
      BACKUP_R2_TIMEOUT: ${BACKUP_R2_TIMEOUT:-2m}
      BACKUP_ALERT_MAX_AGE_HOURS: ${BACKUP_ALERT_MAX_AGE_HOURS:-78}
      OPERATIONS_WEBHOOK_URL: ${OPERATIONS_WEBHOOK_URL:-}
      OPERATIONS_WEBHOOK_SECRET: ${OPERATIONS_WEBHOOK_SECRET:-}
      OPERATIONS_WEBHOOK_TIMEOUT: ${OPERATIONS_WEBHOOK_TIMEOUT:-5s}
      UPLOADS_DIR: /app/uploads
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET wajib diisi}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET wajib diisi}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD wajib diisi}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS wajib diisi}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL wajib diisi}
      FRONTEND_URL: ${FRONTEND_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    volumes:
      - backupdata:/app/backups
      - uploadsdata:/app/uploads
    ports:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkbm}
      POSTGRES_USER: ${POSTGRES_USER:-pkbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkbm}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  backupdata:
  uploadsdata:
