services:
  app:
    build: 
      context: .
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      BACKUP_AUTO_RESTART: ${BACKUP_AUTO_RESTART:-true}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_CRON: ${BACKUP_CRON:-}
      BACKUP_FORMAT: ${BACKUP_FORMAT:-full}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_API_KEY: ${BACKUP_API_KEY:-}
      N8N_PRESENSI_API_KEY: ${N8N_PRESENSI_API_KEY:-}
      BACKUP_OFFSITE_URL: ${BACKUP_OFFSITE_URL:-}
      BACKUP_OFFSITE_METHOD: ${BACKUP_OFFSITE_METHOD:-PUT}
      BACKUP_OFFSITE_TOKEN: ${BACKUP_OFFSITE_TOKEN:-}
      BACKUP_OFFSITE_TIMEOUT: ${BACKUP_OFFSITE_TIMEOUT:-5m}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DRILL_DATABASE_URL: ${BACKUP_DRILL_DATABASE_URL:-}
      BACKUP_R2_ACCOUNT_ID: ${BACKUP_R2_ACCOUNT_ID:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_PREFIX: ${BACKUP_R2_PREFIX:-pkbm-lms}
      BACKUP_R2_RETENTION_DAYS: ${BACKUP_R2_RETENTION_DAYS:-36}
      UPLOADS_DIR: /app/uploads
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    volumes:
      - backupdata:/app/backups
      - uploadsdata:/app/uploads
    ports:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkbm}
      POSTGRES_USER: ${POSTGRES_USER:-pkbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkbm}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  backupdata:
  uploadsdata:
